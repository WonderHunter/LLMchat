<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLMchat</title>
    <script>
      // Applique le thème mémorisé avant le premier rendu, pour éviter un flash clair.
      try {
        var theme = JSON.parse(localStorage.getItem('llmchat')).state.theme
      } catch (error) {
        var theme = 'system'
      }
      if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
